name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Put the page inside the app
        run: mkdir -p android/app/src/main/assets && cp index.html android/app/src/main/assets/index.html
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Name the file with its version
        run: |
          V=$(grep -oP "versionName '\K[^']+" android/app/build.gradle)
          cp android/app/build/outputs/apk/debug/app-debug.apk "AxleWeightPlanner-$V.apk"
          echo "APK=AxleWeightPlanner-$V.apk" >> "$GITHUB_ENV"
          echo "VER=$V" >> "$GITHUB_ENV"
      - name: Remove older files from the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          for a in $(gh release view android-latest --json assets -q '.assets[].name' 2>/dev/null); do gh release delete-asset android-latest "$a" -y; done || true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app (latest)
          body: Install the .apk file on an Android phone. It is built from the latest page (version ${{ env.VER }}).
          files: ${{ env.APK }}
          prerelease: false
