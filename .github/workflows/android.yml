name: Build Android app
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Put the page inside the app
        run: cp index.html android/app/src/main/assets/index.html
      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleDebug
      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk AxleWeightPlanner.apk
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Android app (latest)
          body: Install AxleWeightPlanner.apk on an Android phone. Built from the latest page.
          files: AxleWeightPlanner.apk
          prerelease: false
